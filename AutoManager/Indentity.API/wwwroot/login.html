<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>AutoManager - Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-card {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }

            .login-card h2 {
                margin-bottom: 20px;
                color: #333;
                text-align: center;
            }

        .form-group {
            margin-bottom: 15px;
        }

            .form-group label {
                display: block;
                margin-bottom: 5px;
                color: #666;
            }

            .form-group input {
                width: 100%;
                padding: 10px;
                border: 1px solid #ccc;
                border-radius: 4px;
                box-sizing: border-box;
            }

        .btn-submit {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            border: none;
            color: white;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }

            .btn-submit:hover {
                background-color: #0056b3;
            }

        .error-msg {
            color: red;
            text-align: center;
            margin-top: 10px;
            font-size: 14px;
        }

        /* Estilo do botão / link de registo */
        .register-link {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            color: #666;
        }

            .register-link a {
                color: #28a745;
                text-decoration: none;
                font-weight: bold;
            }

                .register-link a:hover {
                    text-decoration: underline;
                }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>AutoManager Login</h2>
        <form id="loginForm">
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" required placeholder="admin@example.com">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="Admin123!">
            </div>
            <button type="submit" class="btn-submit">Entrar</button>
            <div id="errorMsg" class="error-msg"></div>
        </form>

        <!-- Botão/Link para navegar para a página de registo -->
        <div class="register-link">
            Ainda não tem conta? <a href="register.html">Registar aqui</a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMsg');
            errorDiv.textContent = '';

            try {
                const response = await fetch('https://localhost:7194/api/Auth/login', {
                    method: 'POST',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok && data.isSuccess) {
                    const profileResponse = await fetch('https://localhost:7194/api/Auth/me', {
                        credentials: 'include'
                    });

                    if (!profileResponse.ok) {
                        errorDiv.textContent = 'Não foi possível obter os dados do utilizador.';
                        return;
                    }

                    const profile = await profileResponse.json();

                    if (response.ok && data.isSuccess) {
                        window.location.href = 'https://localhost:7085/dashboard.html';
                    }
                }
            } catch (err) {
                console.error(err);
                errorDiv.textContent = 'Erro de ligação ao servidor.';
            }
        });
    </script>
</body>
</html>
